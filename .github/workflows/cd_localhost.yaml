name: CD Localhost

on:
  workflow_run:
    workflows: ["CI Semantic Versioning"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-localhost:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: self-hosted

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Django
        run: |
          python -m pip install --upgrade pip
          pip install Django

      - name: Stop previous Django server on port 8000
        shell: powershell
        run: |
          $connections = Get-NetTCPConnection -LocalPort 8000 -ErrorAction SilentlyContinue
          if ($connections) {
            $connections | Select-Object -ExpandProperty OwningProcess -Unique | ForEach-Object {
              Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Apply database migrations
        run: python manage.py migrate

      - name: Start Django server on localhost
        shell: powershell
        run: |
          Start-Process -FilePath "python" -ArgumentList "manage.py runserver 127.0.0.1:8000" -WorkingDirectory "$env:GITHUB_WORKSPACE"
          Start-Sleep -Seconds 8
          Invoke-WebRequest -Uri "http://127.0.0.1:8000/polls/" -UseBasicParsing
